[project]
name = "solomon-bot"
version = "0.1.0"
description = "Соломон — Telegram-бот на long polling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.31.0",
    "supabase==2.31.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
]

[project.scripts]
solomon-bot = "solomon.cli:run_bot"
solomon-health = "solomon.cli:run_health"

[dependency-groups]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solomon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Оснастка тестов повторяет сигнатуры aiogram и держит игрушечные «секреты».
"tests/*" = ["S101", "S105", "S106", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["supabase.*", "postgrest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
